name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build EXE Package
      run: ./gradlew packageExe

    # التعديل الأقوى: مسح شامل لكل مجلدات المخرجات لرفع الملف مهما كان مساره الفرعي
    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Amr3D-Nesting-Pro-EXE
        path: |
          **/build/compose/binaries/main/exe/**
          **/build/compose/binaries/main/msi/**
          **/build/distributions/**
        if-no-files-found: warn
