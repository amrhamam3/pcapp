name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # 1. إعداد الـ Gradle بشكل مستقل
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # 2. خطوة توليد الـ Wrapper محلياً في السيرفر لضمان نجاح أي أمر لاحق
    - name: Generate Wrapper
      run: gradle wrapper

    # 3. تشغيل البناء باستخدام الـ Wrapper الذي تم توليده فوراً
    - name: Build EXE Package
      run: ./gradlew packageExe

    # 4. رفع المجلد الرئيسي للمخرجات بالكامل لضمان ظهور الـ Artifacts
    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Amr3D-Nesting-Pro-EXE
        path: build/compose/binaries/
